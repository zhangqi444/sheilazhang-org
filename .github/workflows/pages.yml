name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages has to be switched on by hand once, in Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions. The enablement below asks the API to do
# it, but GITHUB_TOKEN is not allowed to create a Pages site ("Resource not
# accessible by integration"), so until a human flips that switch every run
# fails here. Once it is on, this step just reads the config and passes.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # There is no build step: the repository root is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
